name: build
# Chạy test mỗi lần đẩy mã. Gắn thẻ vX.Y.Z (trùng "version" trong package.json) thì dựng thêm file cài cho Mac và Windows.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test

  dist:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-latest, script: dist:mac }
          - { os: windows-latest, script: dist:win }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Thẻ phải trùng số phiên bản
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # KÝ SỐ (điền ở Settings > Secrets and variables > Actions khi công ty đã có; chưa điền thì dựng bản KHÔNG ký, vẫn chạy được):
          #   Mac:     CSC_LINK (file chứng chỉ "Developer ID Application" .p12, mã hóa base64), CSC_KEY_PASSWORD,
          #            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   (ba khóa sau dùng để Apple "notarize")
          #   Windows: WIN_CSC_LINK (chứng chỉ ký mã .pfx, base64), WIN_CSC_KEY_PASSWORD
          # Bản Mac không có CSC_LINK thì electron-builder tự bỏ qua ký và notarize.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Mã kiểm tra (SHA-256) để nhập vào trang quản trị
        shell: bash
        run: |
          cd dist
          for f in *.dmg *.exe; do [ -f "$f" ] && { s=$(node -e "const c=require('crypto'),fs=require('fs');console.log(c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'),fs.statSync(process.argv[1]).size)" "$f"); echo "$f  $s" | tee -a "$GITHUB_STEP_SUMMARY"; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: softe-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
