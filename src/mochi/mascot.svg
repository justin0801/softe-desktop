.softe-mascot .m-s-shade{stroke:var(--m-body-shade,#7070F6)}
.softe-mascot .m-f-body{fill:url(#sm-body)}
.softe-mascot .m-n{fill:none}
.softe-mascot .m-rc{stroke-linecap:round;stroke-linejoin:round}
.softe-mascot .m-stop-top{stop-color:var(--m-body-top,#7389FD)}
.softe-mascot .m-stop-bottom{stop-color:var(--m-body-bottom,#7D6CF8)}
