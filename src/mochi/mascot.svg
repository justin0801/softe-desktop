.softe-mascot #cheek-r{transform-origin: 140px 390px}
.softe-mascot #cheek-l{transform-origin: 372px 390px}
.softe-mascot #brow-r{transform-origin: 186px 256px}
.softe-mascot #brow-l{transform-origin: 326px 256px}
.softe-mascot #mouth{transform-origin: 256px 394px}
.softe-mascot #antenna{transform-origin: 238px 184px}
