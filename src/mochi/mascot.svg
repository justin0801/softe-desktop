.softe-mascot #accessory{transform-origin: 292px 132px}
.softe-mascot #lid-l,.softe-mascot #lid-r{visibility: visible;transform: scaleY(0)}
.softe-mascot .gaze{transform: translate(calc(var(--look-x,0) * 9px),calc(var(--look-y,0) * 7px));transition: transform 140ms ease-out}
.softe-mascot #face-look{transform: translate(calc(var(--look-x,0) * 5px),calc(var(--look-y,0) * 4px));transition: transform 220ms ease-out}
.softe-mascot #lean{transform: rotate(calc(var(--look-x,0) * 2.5deg));transition: transform 320ms cubic-bezier(.3,1.4,.5,1)}
.softe-mascot .t-lean{transform-box: view-box;transform-origin: 256px 462px;transform: rotate(calc(var(--look-x,0) * 2.5deg));transition: transform 320ms cubic-bezier(.3,1.4,.5,1)}
.softe-mascot .fx,.softe-mascot .outfit{display: none}
.softe-mascot.is-paused,.softe-mascot.is-paused *{animation-play-state: paused !important}
.softe-mascot[data-outfit="study"]{--brow-lift: 0}
.softe-mascot[data-outfit="architect"]{--brow-lift: 0}
.softe-mascot[data-outfit="creator"]{--brow-lift: .25}
.softe-mascot[data-outfit="study"] :is(#brow-l,#brow-r){translate: 0 5px}
.softe-mascot[data-outfit="architect"] :is(#brow-l,#brow-r){translate: 0 11px}
@media (prefers-reduced-motion: reduce){.softe-mascot,.softe-mascot *{animation: none !important;transition: none !important}}
</style>
