.softe-mascot .m-f-stem{fill:var(--m-stem,#33BC8E)}
.softe-mascot .m-f-shadow{fill:var(--m-shadow,rgba(27,31,74,.22))}
.softe-mascot .m-f-contact{fill:var(--m-contact,rgba(32,36,120,.30))}
.softe-mascot .m-s-ink{stroke:var(--m-ink,#1B1F4A)}
.softe-mascot .m-s-star{stroke:var(--m-star,#FFD34E)}
.softe-mascot .m-s-star-shade{stroke:var(--m-star-shade,#F2A93B)}
.softe-mascot .m-s-star-rim{stroke:var(--m-star-rim,#DE8A1C)}
.softe-mascot .m-s-leaf-rim{stroke:var(--m-leaf-rim,#2DB487)}
.softe-mascot .m-s-leaf-shade{stroke:var(--m-leaf-shade,#4FD3A4)}
