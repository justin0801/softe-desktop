<svg xmlns="http://www.w3.org/2000/svg" class="softe-mascot" viewBox="0 0 512 512" data-state="idle" data-outfit="" role="img">
<title>Mochi, bạn đồng hành của softe.ai</title>
<defs>
<style id="tokens">
.softe-mascot{--m-body-top:#7389FD;--m-body-bottom:#7D6CF8;--m-body-shade:#7070F6;--m-gloss:rgba(255,255,255,.38);--m-glow:rgba(255,255,255,.16);--m-rim:rgba(255,255,255,.20);--m-ink:#1B1F4A;--m-ink-glow:#4651C9;--m-sclera:#FFFFFF;--m-blush:#FF9DB0;--m-tongue:#FF8FA6;--m-star:#FFD34E;--m-star-shade:#F2A93B;--m-star-rim:#DE8A1C;--m-leaf:#7CF2C8;--m-leaf-shade:#4FD3A4;--m-leaf-rim:#2DB487;--m-stem:#33BC8E;--m-shadow:rgba(27,31,74,.22);--m-contact:rgba(32,36,120,.30);}
@media (prefers-color-scheme:dark){.softe-mascot:not([data-theme="light"]){--m-shadow:rgba(150,160,255,.30)}}
.softe-mascot[data-theme="dark"]{--m-shadow:rgba(150,160,255,.30)}
.softe-mascot .m-f-shade{fill:var(--m-body-shade,#7070F6)}
.softe-mascot .m-f-gloss{fill:var(--m-gloss,rgba(255,255,255,.38))}
.softe-mascot .m-f-glow{fill:var(--m-glow,rgba(255,255,255,.16))}
.softe-mascot .m-f-rim{fill:var(--m-rim,rgba(255,255,255,.20))}
.softe-mascot .m-f-ink{fill:var(--m-ink,#1B1F4A)}
.softe-mascot .m-f-inkglow{fill:var(--m-ink-glow,#4651C9)}
.softe-mascot .m-f-sclera{fill:var(--m-sclera,#FFFFFF)}
.softe-mascot .m-f-blush{fill:var(--m-blush,#FF9DB0)}
.softe-mascot .m-f-tongue{fill:var(--m-tongue,#FF8FA6)}
.softe-mascot .m-f-star{fill:var(--m-star,#FFD34E)}
.softe-mascot .m-f-star-shade{fill:var(--m-star-shade,#F2A93B)}
.softe-mascot .m-f-star-rim{fill:var(--m-star-rim,#DE8A1C)}
